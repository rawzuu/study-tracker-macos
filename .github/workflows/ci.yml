name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build a testy
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Testy jádra
        run: swift test --package-path Packages/StudyKit

      - name: Projekt (XcodeGen)
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      # Sdílený CI stroj občas přebere popředí jinou aplikací („not foreground“) – neúspěšný UI test
      # se proto jednou zopakuje. Skutečná chyba selže i podruhé. Zaseknutý test spadne po 3 minutách
      # (jinak by vyčerpal celý limit úlohy); průběh testů jde do logu hned.
      - name: Build a UI testy
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project StudyTracker.xcodeproj -scheme StudyTracker \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/dd -resultBundlePath build/UITests.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee build/xcodebuild.log \
            | grep --line-buffered -E "Test Case .*(started|passed|failed)|error:|\*\* (TEST|BUILD)"

      - name: Souhrn UI testů (i zopakované)
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path build/UITests.xcresult | python3 Tools/ci/ui-test-summary.py

      - name: Výsledky UI testů
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: UITests.xcresult
          path: build/UITests.xcresult

  parity:
    name: Parita s webem (WEB_REF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Webová aplikace
        run: |
          git clone --quiet --depth 1 --branch "$(cat Tools/parity/WEB_REF)" https://github.com/rawzuu/study-tracker.git .parity/web
          npm ci --prefix .parity/web --no-audit --no-fund
      - name: Kontrolní data
        run: |
          npm ci --prefix Tools/parity --no-audit --no-fund
          WEB_DIR=$PWD/.parity/web npm run generate --prefix Tools/parity
      - name: Shodují se s uloženými?
        run: git diff --stat --exit-code -- Packages/StudyKit/Tests/CoreTests/Fixtures Packages/StudyKit/Tests/EngineTests/Fixtures
