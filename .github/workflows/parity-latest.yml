# Každý týden zkusí paritní testy proti AKTUÁLNÍ webové aplikaci (větev main).
# Když selžou, web změnil formát dat nebo chování a nativní aplikaci je potřeba dorovnat.
name: Parita s aktuálním webem

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Webová aplikace (main)
        run: |
          git clone --quiet --depth 1 https://github.com/rawzuu/study-tracker.git .parity/web
          echo "Web: $(node -p "require('./.parity/web/package.json').version")"
          npm ci --prefix .parity/web --no-audit --no-fund
      - name: Kontrolní data
        run: |
          npm ci --prefix Tools/parity --no-audit --no-fund
          WEB_DIR=$PWD/.parity/web npm run generate --prefix Tools/parity
          git diff --stat -- Packages/StudyKit/Tests/CoreTests/Fixtures Packages/StudyKit/Tests/EngineTests/Fixtures
      - name: Testy jádra proti aktuálnímu webu
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          swift test --package-path Packages/StudyKit
