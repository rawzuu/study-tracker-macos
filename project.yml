# XcodeGen: `xcodegen generate` vytvoří StudyTracker.xcodeproj (není v gitu).
name: StudyTracker
options:
  bundleIdPrefix: cz.rawzuu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.11.0
    CURRENT_PROJECT_VERSION: 16
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
packages:
  StudyKit:
    path: Packages/StudyKit
targets:
  StudyTracker:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: StudyKit
        product: AppModel
      - package: StudyKit
        product: DesignSystem
      - package: StudyKit
        product: Features
      - package: StudyKit
        product: WidgetData
      # Widgety (rozšíření WidgetKitu) jsou součástí aplikace.
      - target: StudyTrackerWidgets
      # Soustředění: Strážce (pomocník na pozadí, registruje se sám) a rozšíření Safari.
      - target: StudyTrackerGuard
        embed: true
        copy: { destination: wrapper, subpath: Contents/Library/LoginItems }
      - target: StudyTrackerSafari
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # studytracker://casovac?start=1&predmet=…&tema=… – spuštění bloku ze Zkratek, Siri nebo Spotlightu
        CFBundleURLTypes:
          - CFBundleURLName: cz.rawzuu.studytracker.link
            CFBundleURLSchemes: [studytracker]
        # Apple Kalendář: zápis plánu do vlastního kalendáře a obsazený čas z ostatních (jen na žádost v Nastavení).
        # Sdílený kontejner s widgety (souhrn pro widgety a příkazy z jejich tlačítek).
        STAppGroup: $(ST_APP_GROUP)
        # Strážce Soustředění v Contents/Library/LoginItems a rozšíření Safari.
        STGuardBundleId: $(ST_GUARD_BUNDLE_ID)
        STSafariExtensionId: $(ST_SAFARI_EXTENSION_ID)
        # Anki (AnkiConnect) poslouchá jen na http://127.0.0.1:8765 – výjimka ATS jen pro místní adresy.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: Study Tracker zapisuje tvůj studijní plán do kalendáře „Studijní plán“ a události z ostatních kalendářů bere v ranním plánu jako obsazený čas. Ostatní kalendáře jen čte.
    entitlements:
      path: App/StudyTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Jen odchozí spojení (api.github.com a Anki na 127.0.0.1:8765); žádný server.
        com.apple.security.network.client: true
        # Mimo kontejner jen soubory, které uživatel sám vybere (import rozvrhu .ics, export do kalendáře).
        com.apple.security.files.user-selected.read-write: true
        # Apple Kalendář (EventKit) – jen po zapnutí v Nastavení a se souhlasem v systému.
        com.apple.security.personal-information.calendars: true
        # Sdílený kontejner s widgety (identifikátor začíná Team ID – na Macu bez profilu).
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker
        APP_DISPLAY_NAME: Study Tracker
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        ST_GUARD_BUNDLE_ID: cz.rawzuu.studytracker.guard
        ST_SAFARI_EXTENSION_ID: cz.rawzuu.studytracker.safari
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Ikona z Icon Composeru (Liquid Glass); pro macOS 15 z ní Xcode vyrobí klasickou ikonu.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Vývojové sestavení (Xcode ⌘R, UI testy) má vlastní identifikátor, a tedy vlastní data,
        # nastavení, Klíčenku i kontejner widgetů – nikdy nesáhne na data nainstalované aplikace.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker (vývoj)
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
          ST_GUARD_BUNDLE_ID: cz.rawzuu.studytracker.dev.guard
          ST_SAFARI_EXTENSION_ID: cz.rawzuu.studytracker.dev.safari
  StudyTrackerWidgets:
    type: app-extension
    platform: macOS
    # Vlastní kopie ikony aplikace: galerie widgetů ji jinak nemusí najít a ukáže prázdné místo.
    sources:
      - Widgets
      - path: App/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: StudyKit
        product: WidgetUI
      - package: StudyKit
        product: WidgetData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        STAppGroup: $(ST_APP_GROUP)
        STAppBundleId: $(ST_APP_BUNDLE_ID)
    entitlements:
      path: Widgets/StudyTrackerWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.widgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ST_APP_BUNDLE_ID: cz.rawzuu.studytracker
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        APP_DISPLAY_NAME: Study Tracker
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev.widgets
          ST_APP_BUNDLE_ID: cz.rawzuu.studytracker.dev
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker (vývoj)
  # Strážce Soustředění: aplikace bez sandboxu (ovládá ostatní aplikace, čte adresu v Safari), běží na
  # pozadí přes launchd. Plist pro launchd se generuje s identifikátorem podle konfigurace.
  StudyTrackerGuard:
    type: application
    platform: macOS
    sources: [Guard]
    dependencies:
      - package: StudyKit
        product: FocusGuard
    info:
      path: Guard/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        STAppGroup: $(ST_APP_GROUP)
        STAppBundleId: $(ST_APP_BUNDLE_ID)
        NSAppleEventsUsageDescription: Strážce Soustředění čte adresu aktivní záložky Safari, aby zablokoval weby ze tvých seznamů a změřil čas na webech. Nic neodesílá.
    entitlements:
      path: Guard/StudyTrackerGuard.entitlements
      properties:
        # Sdílený kontejner s aplikací (nastavení, databáze měření a pokusů).
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
        # Apple Events k Safari (adresa aktivní záložky) – se souhlasem v Soukromí → Automatizace.
        com.apple.security.automation.apple-events: true
    postBuildScripts:
      - name: Plist pro launchd
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(PRODUCT_BUNDLE_IDENTIFIER).plist
        script: |
          DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$DIR"
          cat > "$DIR/$PRODUCT_BUNDLE_IDENTIFIER.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$PRODUCT_BUNDLE_IDENTIFIER</string>
            <key>BundleProgram</key><string>Contents/MacOS/$EXECUTABLE_NAME</string>
            <key>AssociatedBundleIdentifiers</key><array><string>$ST_APP_BUNDLE_ID</string></array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
            <key>ThrottleInterval</key><integer>5</integer>
            <key>LimitLoadToSessionType</key><string>Aqua</string>
            <key>ProcessType</key><string>Interactive</string>
          </dict>
          </plist>
          PLIST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.guard
        PRODUCT_NAME: StudyTrackerGuard
        APP_DISPLAY_NAME: Study Tracker – Strážce
        ST_APP_BUNDLE_ID: cz.rawzuu.studytracker
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev.guard
          ST_APP_BUNDLE_ID: cz.rawzuu.studytracker.dev
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker – Strážce (vývoj)
  # Rozšíření Safari: blokuje weby ze seznamů ještě před načtením podle stavu od Strážce.
  StudyTrackerSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: Safari
        excludes: [Resources]
      - path: Safari/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: StudyKit
        product: Focus
    info:
      path: Safari/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        STAppGroup: $(ST_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Safari/StudyTrackerSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.safari
        APP_DISPLAY_NAME: Study Tracker – Soustředění
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev.safari
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker – Soustředění (vývoj)
  StudyTrackerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: StudyTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StudyTracker:
    build:
      targets:
        StudyTracker: all
        StudyTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StudyTrackerUITests]
    profile:
      config: Release
    archive:
      config: Release
