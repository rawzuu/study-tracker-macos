# XcodeGen: `xcodegen generate` vytvoří StudyTracker.xcodeproj (není v gitu).
name: StudyTracker
options:
  bundleIdPrefix: cz.rawzuu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.8.1
    CURRENT_PROJECT_VERSION: 10
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
packages:
  StudyKit:
    path: Packages/StudyKit
targets:
  StudyTracker:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: StudyKit
        product: AppModel
      - package: StudyKit
        product: DesignSystem
      - package: StudyKit
        product: Features
      - package: StudyKit
        product: WidgetData
      # Widgety (rozšíření WidgetKitu) jsou součástí aplikace.
      - target: StudyTrackerWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # studytracker://casovac?start=1&predmet=…&tema=… – spuštění bloku ze Zkratek, Siri nebo Spotlightu
        CFBundleURLTypes:
          - CFBundleURLName: cz.rawzuu.studytracker.link
            CFBundleURLSchemes: [studytracker]
        # Apple Kalendář: zápis plánu do vlastního kalendáře a obsazený čas z ostatních (jen na žádost v Nastavení).
        # Sdílený kontejner s widgety (souhrn pro widgety a příkazy z jejich tlačítek).
        STAppGroup: $(ST_APP_GROUP)
        NSCalendarsFullAccessUsageDescription: Study Tracker zapisuje tvůj studijní plán do kalendáře „Studijní plán“ a události z ostatních kalendářů bere v ranním plánu jako obsazený čas. Ostatní kalendáře jen čte.
    entitlements:
      path: App/StudyTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Jen odchozí spojení (api.github.com); žádný server.
        com.apple.security.network.client: true
        # Mimo kontejner jen soubory, které uživatel sám vybere (import rozvrhu .ics, export do kalendáře).
        com.apple.security.files.user-selected.read-write: true
        # Apple Kalendář (EventKit) – jen po zapnutí v Nastavení a se souhlasem v systému.
        com.apple.security.personal-information.calendars: true
        # Sdílený kontejner s widgety (identifikátor začíná Team ID – na Macu bez profilu).
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker
        APP_DISPLAY_NAME: Study Tracker
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Ikona z Icon Composeru (Liquid Glass); pro macOS 15 z ní Xcode vyrobí klasickou ikonu.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Vývojové sestavení (Xcode ⌘R, UI testy) má vlastní identifikátor, a tedy vlastní data,
        # nastavení, Klíčenku i kontejner widgetů – nikdy nesáhne na data nainstalované aplikace.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker (vývoj)
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
  StudyTrackerWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets]
    dependencies:
      - package: StudyKit
        product: WidgetUI
      - package: StudyKit
        product: WidgetData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        STAppGroup: $(ST_APP_GROUP)
        STAppBundleId: $(ST_APP_BUNDLE_ID)
    entitlements:
      path: Widgets/StudyTrackerWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.widgets
        ST_APP_BUNDLE_ID: cz.rawzuu.studytracker
        ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker
        APP_DISPLAY_NAME: Study Tracker
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.dev.widgets
          ST_APP_BUNDLE_ID: cz.rawzuu.studytracker.dev
          ST_APP_GROUP: $(DEVELOPMENT_TEAM).cz.rawzuu.studytracker.dev
          APP_DISPLAY_NAME: Study Tracker (vývoj)
  StudyTrackerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: StudyTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.rawzuu.studytracker.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StudyTracker:
    build:
      targets:
        StudyTracker: all
        StudyTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StudyTrackerUITests]
    profile:
      config: Release
    archive:
      config: Release
