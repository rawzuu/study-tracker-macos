<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zablokováno</title>
<link rel="stylesheet" href="blocked.css">
</head>
<body>
<main>
  <p class="brand">Study Tracker · Soustředění</p>
  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
  <p class="label">Zablokováno</p>
  <h1 id="title">Web</h1>
  <p id="detail"></p>
  <div id="clock" class="clock" hidden><span id="left"></span><small>zbývá do konce</small></div>
  <p id="count" class="count" hidden></p>
  <p id="quote" class="quote"></p>
  <div class="actions">
    <button id="close" class="ghost">Zavřít panel</button>
    <button id="back" class="primary">Zpět</button>
  </div>
  <button id="unlock" class="link" hidden>Odemknout…</button>
  <p id="note" class="note" hidden></p>
</main>
<script src="blocked.js"></script>
</body>
</html>
